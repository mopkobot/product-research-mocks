serif" font-size="10.5" font-weight="600" fill="#5F6673" text-anchor="start" letter-spacing="0.4">Starting point</text><rect x="1026" y="496" width="364" height="86" rx="10" ry="10" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><circle cx="1048" cy="526" r="8" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="1068" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">From current finances</text><text x="1068" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6673" text-anchor="start">Follows later finance edits.</text><rect x="1026" y="594" width="364" height="120" rx="10" ry="10" fill="#F2F4F7" stroke="#111827" stroke-width="2"/><circle cx="1048" cy="624" r="8" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><circle cx="1048" cy="624" r="4" fill="#111827" stroke="none"/><text x="1068" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">From a fixed date</text><text x="1068" y="646" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6673" text-anchor="start">Frozen starting balances.</text><text x="1068" y="672" font-family="Menlo, monospace" font-size="12" font-weight="400" fill="#111827" text-anchor="start">Jan 2026</text><rect x="1302" y="613" width="52" height="20" rx="10" ry="10" fill="#F2F4F7" stroke="none"/><text x="1328.0" y="628" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#374151" text-anchor="middle">FROZEN</text><text x="1026" y="736" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5F6673" text-anchor="start" letter-spacing="0.4">Start date</text><rect x="1026" y="744" width="150" height="36" rx="8" ry="8" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="1038" y="766.5" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#111827" text-anchor="start">2026-01-01</text><rect x="1026" y="794" width="107" height="34" rx="8" ry="8" fill="#111827" stroke="none"/><text x="1079.5" y="815.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Create plan</text><circle cx="248" cy="240" r="11" fill="#111827" stroke="none"/><text x="248" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="248" cy="268" r="11" fill="#111827" stroke="none"/><text x="248" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="248" cy="452" r="11" fill="#111827" stroke="none"/><text x="248" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="248" cy="700" r="11" fill="#111827" stroke="none"/><text x="248" y="704" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="272" y="868" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5F6673" text-anchor="start" letter-spacing="0.9">ANNOTATIONS</text><circle cx="283" cy="888" r="11" fill="#111827" stroke="none"/><text x="283" y="892" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="304" y="892" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Plans show name, icon, mode, and updated date. Icon, notes, and name appear in the sidebar and plan header.</text><circle cx="283" cy="917" r="11" fill="#111827" stroke="none"/><text x="283" y="921" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="304" y="921" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Name and notes persist as typed. Validation is UX-only; the backend is authoritative.</text><circle cx="283" cy="946" r="11" fill="#111827" stroke="none"/><text x="283" y="950" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="304" y="950" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Fixed date freezes the starting point. After Jan 2026, balance edits in Current Finances leave this plan&#x27;s start</text><text x="304" y="967" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">balances untouched.</text><circle cx="283" cy="992" r="11" fill="#111827" stroke="none"/><text x="283" y="996" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="304" y="996" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Current-finances mode follows later edits, so the same finance change moves this plan&#x27;s starting conditions.</text></svg>