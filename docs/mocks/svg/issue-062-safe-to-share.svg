11827" stroke="none"/><text x="1276.0" y="32.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Run plan</text><rect x="0" y="56" width="240" height="804" rx="0" ry="0" fill="#FFFFFF" stroke="none"/><line x1="240" y1="56" x2="240" y2="860" stroke="#D5D9DF" stroke-width="1"/><rect x="20" y="71" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="76" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Dashboard</text><rect x="20" y="105" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="110" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Current Finances</text><rect x="20" y="139" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="144" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Plans</text><text x="20" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">PLAN</text><rect x="20" y="205" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Income</text><rect x="20" y="239" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Expenses &amp; flows</text><rect x="20" y="273" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Assets &amp; debts</text><rect x="20" y="307" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Milestones</text><rect x="20" y="341" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="346" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Strategy</text><rect x="20" y="375" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Estate</text><text x="20" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">ANALYZE</text><rect x="20" y="441" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="446" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Projection</text><rect x="20" y="475" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="480" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Tax analytics</text><rect x="20" y="509" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="514" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Monte Carlo</text><rect x="20" y="543" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="548" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Compare</text><rect x="20" y="577" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="582" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Snapshots</text><text x="20" y="634" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.8">ACCOUNT</text><rect x="10" y="634" width="220" height="32" rx="7" ry="7" fill="#F2F4F7" stroke="none"/><rect x="20" y="643" width="12" height="12" rx="3" ry="3" fill="#111827" stroke="none"/><text x="44" y="648" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">Data &amp; sharing</text><rect x="20" y="677" width="12" height="12" rx="3" ry="3" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="44" y="682" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">Settings</text><text x="272" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#667085" text-anchor="start" letter-spacing="0.7">PLANS / PLAN FOR RETIREMENT / SHARE</text><text x="272" y="124" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#111827" text-anchor="start">Safe-to-share</text><text x="272" y="146" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6673" text-anchor="start">Read-only, redacted, revocable.</text><rect x="1299.0" y="100" width="107" height="34" rx="8" ry="8" fill="#111827" stroke="none"/><text x="1352.5" y="121.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Revoke link</text><rect x="272" y="176" width="716" height="260" rx="12" ry="12" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="290" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="start">Share link</text><text x="290" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5F6673" text-anchor="start" letter-spacing="0.4">Link</text><rect x="290" y="238" width="380" height="36" rx="8" ry="8" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="302" y="260.5" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#111827" text-anchor="start">plan.app/s/7f2c9d</text><text x="290" y="289" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#667085" text-anchor="start">Read-only · expires never</text><text x="692" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5F6673" text-anchor="start" letter-spacing="0.4">Status</text><rect x="692" y="238" width="200" height="36" rx="8" ry="8" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="704" y="260.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start">Active</text><rect x="290" y="308" width="93" height="34" rx="8" ry="8" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="336.5" y="329.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">Copy link</text><rect x="393" y="308" width="107" height="34" rx="8" ry="8" fill="#111827" stroke="none"/><text x="446.5" y="329.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Revoke link</text><text x="290" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#667085" text-anchor="start">Revoking makes the link return 404 on the next open. Existing recipients are not notified.</text><rect x="290" y="400" width="680" height="46" rx="8" ry="8" fill="#F2F4F7" stroke="#D5D9DF" stroke-width="1" stroke-dasharray="4 4"/><text x="306" y="421" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#374151" text-anchor="start">i</text><text x="324" y="427" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">The recipient cannot edit, export, or discover the original plan.</text><rect x="272" y="460" width="716" height="374" rx="12" ry="12" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="290" y="490" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="start">Recipient preview</text><rect x="290" y="516" width="680" height="40" rx="8" ry="8" fill="#F2F4F7" stroke="none"/><text x="304" y="541" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Read-only shared plan · owner redacted amounts</text><text x="304" y="584" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="start">Plan For Retirement</text><text x="304" y="608" font-family="Menlo, monospace" font-size="12.5" font-weight="400" fill="#5F6673" text-anchor="start">Net worth ███████ · Legacy ███████</text><text x="304" y="648" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#111827" text-anchor="start">Allocation</text><text x="304" y="684.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">Stocks</text><rect x="394" y="672" width="502" height="16" rx="4" ry="4" fill="#F2F4F7" stroke="none"/><rect x="394" y="672" width="502.0" height="16" rx="4" ry="4" fill="#374151" stroke="none"/><text x="906" y="684.0" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">60%</text><text x="304" y="722.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="start">Bonds</text><rect x="394" y="710" width="502" height="16" rx="4" ry="4" fill="#F2F4F7" stroke="none"/><rect x="394" y="710" width="334.6666666666667" height="16" rx="4" ry="4" fill="#374151" stroke="none"/><text x="906" y="722.0" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">40%</text><text x="304" y="752" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F6673" text-anchor="start">Milestones · Retirement 2045 · FI 2042 · Life expectancy 2075</text><text x="304" y="794" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#667085" text-anchor="start">No edit action. No export action. No account details.</text><rect x="1008" y="176" width="400" height="360" rx="12" ry="12" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="1026" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="start">Redaction</text><text x="1026" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5F6673" text-anchor="start" letter-spacing="0.4">Amounts</text><rect x="1026" y="238" width="364" height="36" rx="8" ry="8" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="1038" y="260.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start">Hidden</text><polyline points="1368,250.0 1374,256.0 1380,250.0" fill="none" stroke="#5F6673" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="1026" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5F6673" text-anchor="start" letter-spacing="0.4">Percentages</text><rect x="1026" y="304" width="364" height="36" rx="8" ry="8" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="1038" y="326.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#111827" text-anchor="start">Visible</text><polyline points="1368,316.0 1374,322.0 1380,316.0" fill="none" stroke="#5F6673" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="1026" y="370" width="38" height="21" rx="10.5" ry="10.5" fill="#111827" stroke="none"/><circle cx="1047" cy="380.5" r="8" fill="#FFFFFF" stroke="none"/><text x="1074" y="385.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Show plan shape</text><rect x="1026" y="406" width="38" height="21" rx="10.5" ry="10.5" fill="#E9ECF1" stroke="none"/><circle cx="1043" cy="416.5" r="8" fill="#FFFFFF" stroke="none"/><text x="1074" y="421.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">Show account names</text><text x="1026" y="452" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#667085" text-anchor="start">Amounts are hidden or scaled. Percentages and shape remain.</text><rect x="1008" y="560" width="400" height="274" rx="12" ry="12" fill="#FFFFFF" stroke="#D5D9DF" stroke-width="1"/><text x="1026" y="590" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="start">Access</text><text x="1026" y="622" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F6673" text-anchor="start">Opened 3 times · last Aug 26 2026</text><text x="1026" y="650" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#111827" text-anchor="start">Recipient can view only</text><circle cx="1034" cy="680" r="3" fill="#111827" stroke="none"/><text x="1048" y="684" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6673" text-anchor="start">View plan shape</text><circle cx="1034" cy="706" r="3" fill="#111827" stroke="none"/><text x="1048" y="710" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F6673" text-anchor="start">No edit, export, or original-plan discovery</text><circle cx="248" cy="216" r="11" fill="#111827" stroke="none"/><text x="248" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="248" cy="500" r="11" fill="#111827" stroke="none"/><text x="248" y="504" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="248" cy="528" r="11" fill="#111827" stroke="none"/><text x="248" y="532" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="248" cy="600" r="11" fill="#111827" stroke="none"/><text x="248" y="604" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="272" y="888" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#5F6673" text-anchor="start" letter-spacing="0.9">ANNOTATIONS</text><circle cx="283" cy="908" r="11" fill="#111827" stroke="none"/><text x="283" y="912" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="304" y="912" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">A share link opens a read-only, redacted view with a stable URL that the owner can revoke at any time.</text><circle cx="283" cy="937" r="11" fill="#111827" stroke="none"/><text x="283" y="941" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="304" y="941" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">The recipient sees the plan shape, percentages, and milestones. Dollar amounts are hidden or scaled.</text><circle cx="283" cy="966" r="11" fill="#111827" stroke="none"/><text x="283" y="970" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="304" y="970" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">Redaction is a server-side setting, so the payload never contains the hidden values.</text><circle cx="283" cy="995" r="11" fill="#111827" stroke="none"/><text x="283" y="999" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="304" y="999" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">The recipient cannot edit, export, or discover the original plan; revoking returns 404 on the next open.</text></svg>